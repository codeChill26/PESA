<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312e81" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" opacity="0.08" />

  <!-- Microphone & Sound Waves Graphic -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Sound waves left and right -->
    <path d="M 60 170 C 40 130, 40 210, 60 170" stroke="white" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 40 170 C 15 110, 15 230, 40 170" stroke="white" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M 240 170 C 260 130, 260 210, 240 170" stroke="white" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 260 170 C 285 110, 285 230, 260 170" stroke="white" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Mic Capsule -->
    <rect x="110" y="70" width="80" height="150" rx="40" fill="white" />
    <line x1="120" y1="120" x2="180" y2="120" stroke="#e0e7ff" stroke-width="6" stroke-linecap="round" />
    <line x1="120" y1="150" x2="180" y2="150" stroke="#e0e7ff" stroke-width="6" stroke-linecap="round" />

    <!-- Mic Cradle -->
    <path d="M 80 150 C 80 235, 220 235, 220 150" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" />

    <!-- Mic Stand -->
    <line x1="150" y1="235" x2="150" y2="285" stroke="white" stroke-width="18" stroke-linecap="round" />
    <line x1="100" y1="285" x2="200" y2="285" stroke="white" stroke-width="18" stroke-linecap="round" />

    <!-- AI Sparkle Top Right -->
    <path d="M 230 40 Q 230 65 255 65 Q 230 65 230 90 Q 230 65 205 65 Q 230 65 230 40 Z" fill="url(#goldGrad)" />
    <!-- Mini Sparkle -->
    <path d="M 70 50 Q 70 65 85 65 Q 70 65 70 80 Q 70 65 55 65 Q 70 65 70 50 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>

  <!-- PESA Text Badge -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4" text-anchor="middle">PESA</text>
</svg>
